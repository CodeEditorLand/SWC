[dependencies]
is-macro = { workspace = true }
serde = { workspace = true, features = ["derive"], optional = true }
string_enum = { version = "1.0.0", path = "../string_enum/" }
swc_atoms = { version = "3.1.0", path = "../swc_atoms" }
swc_common = { version = "6.1.1", path = "../swc_common" }

[features]
serde-impl = ["serde"]

[lib]
bench = false
path = "Source/lib.rs"

[package]
authors = [
  "강동윤 <kdy1997.dev@gmail.com>",
  "Alexander Akait <sheo13666q@gmail.com>",
]
description = "AST definitions of xml"
documentation = "https://rustdoc.swc.rs/swc_xml_ast/"
edition = "2024"
license-file = { workspace = true }
name = "swc_xml_ast"
repository = "https://github.com/swc-project/swc.git"
version = "6.0.0"
