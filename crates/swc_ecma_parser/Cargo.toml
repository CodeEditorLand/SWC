[[bench]]
harness = false
name = "compare"

[[bench]]
harness = false
name = "lexer"

[[bench]]
harness = false
name = "parser"

[dependencies]
either = { workspace = true }
new_debug_unreachable = { workspace = true }
num-bigint = { workspace = true }
num-traits = { workspace = true }
phf = { workspace = true, features = ["macros"] }
rustc-hash = { workspace = true }
serde = { workspace = true, features = ["derive"] }
smallvec = { workspace = true }
smartstring = { workspace = true }
swc_atoms = { version = "3.1.0", path = "../swc_atoms" }
swc_common = { version = "6.1.1", path = "../swc_common" }
swc_ecma_ast = { version = "6.1.0", path = "../swc_ecma_ast" }
swc_ecma_visit = { version = "6.0.0", path = "../swc_ecma_visit", optional = true }
tracing = { workspace = true }
typed-arena = { workspace = true }

[dev-dependencies]
codspeed-criterion-compat = { workspace = true }
criterion = { workspace = true }
pretty_assertions = { workspace = true }
serde_json = { workspace = true }
swc_ecma_ast = { version = "6.1.0", path = "../swc_ecma_ast", features = [
  "serde-impl",
] }
swc_ecma_visit = { version = "6.0.0", path = "../swc_ecma_visit" }
swc_malloc = { version = "1.0.0", path = "../swc_malloc" }
testing = { version = "6.0.0", path = "../testing" }
walkdir = { workspace = true }

[[example]]
name = "lexer"

[[example]]
name = "typescript"

[features]
debug = ["tracing-spans"]
default = ["typescript", "stacker"]
tracing-spans = []
typescript = []
verify = ["swc_ecma_visit"]

[lib]
bench = false
path = "Source/lib.rs"

[package]
authors = ["강동윤 <kdy1997.dev@gmail.com>"]
description = "Feature-complete es2019 parser."
documentation = "https://rustdoc.swc.rs/swc_ecma_parser/"
edition = { workspace = true }
include = ["Cargo.toml", "src/**/*.rs", "examples/**/*.rs"]
license-file = { workspace = true }
name = "swc_ecma_parser"
repository = { workspace = true }
version = "8.0.2"

[package.metadata]

[package.metadata.docs]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[target]

[target.'cfg(not(any(target_arch = "wasm32", target_arch = "arm")))']

[target.'cfg(not(any(target_arch = "wasm32", target_arch = "arm")))'.dependencies]
stacker = { version = "0.1.18", optional = true }
