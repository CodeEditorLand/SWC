[package]
authors       = ["강동윤 <kdy1997.dev@gmail.com>"]
description   = "Feature-complete es2019 parser."
documentation = "https://rustdoc.swc.rs/swc_ecma_parser/"
edition       = { workspace = true }
include       = ["Cargo.toml", "src/**/*.rs", "examples/**/*.rs"]
license       = { workspace = true }
name          = "swc_ecma_parser"
repository    = { workspace = true }
version       = "10.0.0"

[[bench]]
harness = false
name = "lexer"

[[bench]]
harness = false
name = "parser"

[dependencies]
either      = { workspace = true }
num-bigint  = { workspace = true }
num-traits  = { workspace = true }
rustc-hash  = { workspace = true }
serde       = { workspace = true, features = ["derive"] }
smallvec    = { workspace = true }
smartstring = { workspace = true }
swc_atoms = { version = "3.1.0", path = "../swc_atoms" }
swc_common = { version = "6.1.1", path = "../swc_common" }
swc_ecma_ast = { version = "6.1.0", path = "../swc_ecma_ast" }
swc_ecma_visit = { version = "6.0.0", path = "../swc_ecma_visit", optional = true }
tracing = { workspace = true }
typed-arena = { workspace = true }

new_debug_unreachable = { workspace = true }
phf                   = { workspace = true, features = ["macros"] }
swc_atoms             = { version = "5.0.0", path = "../swc_atoms" }
swc_common            = { version = "8.0.0", path = "../swc_common" }
swc_ecma_ast          = { version = "8.0.0", path = "../swc_ecma_ast" }
swc_ecma_visit        = { version = "8.0.0", path = "../swc_ecma_visit", optional = true }

[target.'cfg(not(any(target_arch = "wasm32", target_arch = "arm")))'.dependencies]
stacker = { version = "0.1.15", optional = true }

[dev-dependencies]
codspeed-criterion-compat = { workspace = true }
swc_ecma_ast = { version = "8.0.0", path = "../swc_ecma_ast", features = [
  "serde-impl",
] }
swc_ecma_visit = { version = "8.0.0", path = "../swc_ecma_visit" }
swc_malloc = { version = "1.2.2", path = "../swc_malloc" }
testing = { version = "8.0.0", path = "../testing" }

[[example]]
name = "lexer"

[[example]]
name = "typescript"

[features]
debug = ["tracing-spans"]
default = ["typescript", "stacker"]
tracing-spans = []
typescript = []
verify = ["swc_ecma_visit"]

[lib]
bench = false
path = "Source/lib.rs"

