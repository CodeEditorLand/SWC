[[bench]]
harness = false
name = "compat"

[dependencies]
once_cell = { workspace = true }
rustc-hash = { workspace = true }
ryu-js = { workspace = true }
serde = { workspace = true, features = ["derive"] }
swc_atoms = { version = "5.0.0", path = "../swc_atoms" }
swc_common = { version = "8.0.1", path = "../swc_common" }
swc_ecma_ast = { version = "8.1.0", path = "../swc_ecma_ast" }
swc_ecma_transforms_base = { version = "12.0.0", path = "../swc_ecma_transforms_base" }
swc_ecma_transforms_react = { version = "13.0.0", path = "../swc_ecma_transforms_react" }
swc_ecma_utils = { version = "12.0.0", path = "../swc_ecma_utils" }
swc_ecma_visit = { version = "8.0.0", path = "../swc_ecma_visit" }

[dev-dependencies]
codspeed-criterion-compat = { workspace = true }
criterion = { workspace = true }
swc_ecma_codegen = { version = "8.0.2", path = "../swc_ecma_codegen" }
swc_ecma_parser = { version = "11.0.0", path = "../swc_ecma_parser" }
swc_ecma_transforms_compat = { version = "13.0.0", path = "../swc_ecma_transforms_compat" }
swc_ecma_transforms_proposal = { version = "12.0.0", path = "../swc_ecma_transforms_proposal" }
swc_ecma_transforms_testing = { version = "12.0.0", path = "../swc_ecma_transforms_testing" }
testing = { version = "8.0.0", path = "../testing" }

[features]
concurrent = ["swc_common/concurrent"]

[lib]
bench = false
path = "Source/lib.rs"

swc_atoms                 = { version = "5.0.0", path = "../swc_atoms" }
swc_common                = { version = "8.1.0", path = "../swc_common" }
swc_ecma_ast              = { version = "8.1.1", path = "../swc_ecma_ast" }
swc_ecma_transforms_base  = { version = "12.1.1", path = "../swc_ecma_transforms_base" }
swc_ecma_transforms_react = { version = "13.0.1", path = "../swc_ecma_transforms_react" }
swc_ecma_utils            = { version = "12.0.0", path = "../swc_ecma_utils" }
swc_ecma_visit            = { version = "8.0.0", path = "../swc_ecma_visit" }

[dev-dependencies]
codspeed-criterion-compat = { workspace = true }
criterion                 = { workspace = true }

swc_ecma_codegen             = { version = "10.0.0", path = "../swc_ecma_codegen" }
swc_ecma_parser              = { version = "11.0.1", path = "../swc_ecma_parser" }
swc_ecma_transforms_compat   = { version = "13.0.0", path = "../swc_ecma_transforms_compat" }
swc_ecma_transforms_proposal = { version = "12.0.0", path = "../swc_ecma_transforms_proposal" }
swc_ecma_transforms_testing  = { version = "15.0.0", path = "../swc_ecma_transforms_testing" }
testing                      = { version = "9.0.0", path = "../testing" }

[[bench]]
harness = false
name    = "compat"
