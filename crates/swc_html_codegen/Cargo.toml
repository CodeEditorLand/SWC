swc_html_utils = { version = "8.0.0", path = "../swc_html_utils" }

[dev-dependencies]
swc_common = { version = "8.1.0", path = "../swc_common", features = [
  "sourcemap",
] }
swc_html_parser = { version = "8.0.0", path = "../swc_html_parser" }
swc_html_visit = { version = "8.0.0", path = "../swc_html_visit" }
testing = { version = "9.0.0", path = "../testing" }
