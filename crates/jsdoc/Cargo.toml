[dependencies]
nom = { workspace = true }
serde = { workspace = true, features = ["derive"], optional = true }
swc_atoms = { version = "5.0.0", path = "../swc_atoms" }
swc_common = { version = "8.0.1", path = "../swc_common" }

[dev-dependencies]
anyhow = { workspace = true }
dashmap = { workspace = true }
swc_ecma_ast = { version = "8.1.0", path = "../swc_ecma_ast" }
swc_ecma_parser = { version = "11.0.0", path = "../swc_ecma_parser" }
testing = { version = "8.0.0", path = "../testing" }

[features]
serde-impl = ["serde"]

[lib]
bench = false
path = "Source/lib.rs"

[package]
authors = ["강동윤 <kdy1997.dev@gmail.com>"]
description = "JsDoc parser writen in rust"
documentation = "https://rustdoc.swc.rs/jsdoc/"
edition = { workspace = true }
include = ["Cargo.toml", "src/**/*.rs"]
license-file = { workspace = true }
name = "jsdoc"
repository = { workspace = true }
version = "8.0.0"
