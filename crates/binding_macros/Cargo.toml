[package]
authors     = ["강동윤 <kdy1997.dev@gmail.com>", "OJ Kwon <kwon.ohjoong@gmail.com>"]
description = "Macros to build customized bindings interface"
edition     = { workspace = true }
license     = { workspace = true }
name        = "binding_macros"
repository  = { workspace = true }
version     = "16.0.0"

[dependencies.wasm-bindgen]
features = ["enable-interning"]
optional = true
workspace = true

[dependencies.wasm-bindgen-futures]
optional = true
workspace = true

[features]
binding_native = []
binding_wasm = [
  # SWC features
  "swc",
  "swc_common",
  "swc_ecma_transforms",
  "swc_ecma_ast",
  "swc_ecma_visit",

  # Optional packages
  "once_cell",
  "wasm-bindgen",
  "wasm-bindgen-futures",
  "js-sys",
  "serde",
  "serde-wasm-bindgen",
  "anyhow",
  "console_error_panic_hook",
]

[dependencies]
# Common deps for the SWC imports
swc                 = { optional = true, version = "16.1.1", path = "../swc" }
swc_common          = { optional = true, version = "8.0.0", path = "../swc_common" }
swc_ecma_ast        = { optional = true, version = "8.0.0", path = "../swc_ecma_ast" }
swc_ecma_transforms = { optional = true, version = "14.0.0", path = "../swc_ecma_transforms" }
swc_ecma_visit      = { optional = true, version = "8.0.0", path = "../swc_ecma_visit" }

[package]
authors = ["강동윤 <kdy1997.dev@gmail.com>", "OJ Kwon <kwon.ohjoong@gmail.com>"]
description = "Macros to build customized bindings interface"
edition = { workspace = true }
license-file = { workspace = true }
name = "binding_macros"
repository = { workspace = true }
version = "13.0.0"
