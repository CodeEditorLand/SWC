[dependencies]
indexmap = { workspace = true }
rustc-hash = { workspace = true }
swc_atoms = { version = "5.0.0", path = "../swc_atoms" }
swc_common = { version = "8.0.1", path = "../swc_common" }
swc_ecma_ast = { version = "8.1.0", path = "../swc_ecma_ast" }
swc_ecma_utils = { version = "12.0.0", path = "../swc_ecma_utils" }
swc_ecma_visit = { version = "8.0.0", path = "../swc_ecma_visit" }
swc_timer = { version = "1.0.0", path = "../swc_timer" }
tracing = { workspace = true }

[features]
concurrent = ["swc_common/concurrent", "indexmap/rayon"]
trace-ast = []
tracing-spans = []

[lib]
bench = false
path = "Source/lib.rs"

[package]
authors = ["강동윤 <kdy1997.dev@gmail.com>"]
description = "EcmaScript variable usage analyzer"
documentation = "https://rustdoc.swc.rs/swc_ecma_usage_analyzer/"
edition = { workspace = true }
include = ["Cargo.toml", "src/**/*.rs"]
license-file = { workspace = true }
name = "swc_ecma_usage_analyzer"
repository = { workspace = true }
version = "13.0.0"

[package.metadata]

[package.metadata.docs]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
