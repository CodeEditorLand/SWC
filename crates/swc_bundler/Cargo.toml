[dependencies]
anyhow = { workspace = true }
crc = { workspace = true }
dashmap = { workspace = true, optional = true }
indexmap = { workspace = true }
is-macro = { workspace = true }
once_cell = { workspace = true }
parking_lot = { workspace = true }
petgraph = { workspace = true }
radix_fmt = { workspace = true }
rayon = { workspace = true, optional = true }
relative-path = { workspace = true }
rustc-hash = { workspace = true }
swc_atoms = { version = "5.0.0", path = "../swc_atoms" }
swc_common = { version = "8.0.1", path = "../swc_common" }
swc_ecma_ast = { version = "8.1.0", path = "../swc_ecma_ast" }
swc_ecma_codegen = { version = "8.0.2", path = "../swc_ecma_codegen" }
swc_ecma_loader = { version = "8.0.0", path = "../swc_ecma_loader" }
swc_ecma_parser = { version = "11.0.0", path = "../swc_ecma_parser" }
swc_ecma_transforms_base = { version = "12.0.0", path = "../swc_ecma_transforms_base" }
swc_ecma_transforms_optimization = { version = "12.0.0", path = "../swc_ecma_transforms_optimization" }
swc_ecma_utils = { version = "12.0.0", path = "../swc_ecma_utils" }
swc_ecma_visit = { version = "8.0.0", path = "../swc_ecma_visit" }
swc_graph_analyzer = { version = "8.0.0", path = "../swc_graph_analyzer/" }
tracing = { workspace = true }

[dev-dependencies]
hex = { workspace = true }
ntest = { workspace = true }
par-core = { workspace = true, features = ["chili"] }
path-clean = "1.0.1"
reqwest = { workspace = true, features = ["blocking"] }
sha1 = { workspace = true }
swc_ecma_loader = { version = "8.0.0", path = "../swc_ecma_loader", features = [
  "node",
  "cache",
] }
swc_ecma_minifier = { version = "13.0.0", path = "../swc_ecma_minifier", features = [
  "concurrent",
] }
swc_ecma_transforms_proposal = { version = "12.0.0", path = "../swc_ecma_transforms_proposal" }
swc_ecma_transforms_react = { version = "13.0.0", path = "../swc_ecma_transforms_react" }
swc_ecma_transforms_typescript = { version = "13.0.0", path = "../swc_ecma_transforms_typescript" }
swc_malloc = { version = "1.2.2", path = "../swc_malloc" }
tempfile = { workspace = true }
testing = { version = "8.0.0", path = "../testing" }
url = { workspace = true }

[features]
concurrent = ["swc_common/concurrent", "dashmap", "rayon", "indexmap/rayon"]
default = []

[lib]
bench = false
path = "Source/lib.rs"

[package]
authors = ["강동윤 <kdy1997.dev@gmail.com>"]
build = "build.rs"
description = "Very fast ecmascript bundler"
documentation = "https://rustdoc.swc.rs/swc_bundler/"
edition = { workspace = true }
include = ["Cargo.toml", "build.rs", "src/**/*.rs", "src/**/*.js"]
license-file = { workspace = true }
name = "swc_bundler"
repository = { workspace = true }
version = "12.0.0"

[package.metadata]

[package.metadata.docs]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
