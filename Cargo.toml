[profile]

[profile.bench]
debug = true
lto = true

[profile.dev]

[profile.dev.build-override]
opt-level = 3

[profile.dev.package]

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true

[workspace]
members = ["xtask", "crates/*", "tools/generate-code", "tools/swc-releaser"]
resolver = "2"

[workspace.dependencies]
